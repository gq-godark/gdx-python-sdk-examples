[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "godark"
version = "0.2.0"
description = "Python SDK for the GoDark DEX -- encrypted trading over WebSocket"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Typing :: Typed",
]
dependencies = [
    "websockets>=13.0",
    "cryptography>=42.0",
    "protobuf>=7.35.1",
    "httpx>=0.27",
    "pyhpke>=0.6.5",
]

[project.urls]
Homepage = "https://godark.exchange"

[tool.hatch.build.targets.wheel]
packages = ["godark"]
