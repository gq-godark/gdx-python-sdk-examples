name: Auto-bump SDK pin

# Layer 2 listener. Triggered by gdx-python-sdk's notify-examples.yml
# dispatch (event_type=gdx-sdk-changed) or manually via workflow_dispatch.
# Clones gdx-python-sdk at the dispatched SHA, runs scripts/refresh_sdk.sh
# to rsync sdk/godark/ + shared/symbols.json into this repo, and opens or
# refreshes a rolling PR (auto/bump-sdk-pin) against main.
#
# Unlike the Java listener, this workflow does NOT need a build toolchain:
#   - scripts/refresh_sdk.sh does a plain rsync, no compile step.
#   - It depends on $SRC/src/godark/_generated/ already existing, which is
#     always true because gdx-python-sdk commits its regenerated bindings
#     (auto-regen-protos.yml writes them back into the SDK).
#   - The upstream-read token therefore only needs scope on
#     gdx-python-sdk; gdx-proto is not cloned here.
#
# Idempotent: re-running against the same SHA produces no drift on sdk/
# and exits clean without opening a PR. Each new SDK SHA force-pushes
# the rolling branch, so we get one PR per merge cycle instead of one
# PR per upstream commit.

on:
  repository_dispatch:
    types: [gdx-sdk-changed]
  workflow_dispatch:
    inputs:
      sdk_sha:
        description: gdx-python-sdk commit SHA to vendor (for manual testing)
        required: true
        type: string

permissions:
  # Default GITHUB_TOKEN is read-only. All writes go through the two
  # scoped App tokens below.
  contents: read

concurrency:
  # Serialize bumps so two near-simultaneous dispatches don't fight over
  # the auto/bump-sdk-pin branch — the second run waits for the first to
  # finish.
  group: auto-bump-sdk-pin
  cancel-in-progress: false

jobs:
  bump:
    name: Refresh sdk/godark + open PR if drift
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token (local-repo writes)
        id: app-token-local
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GDX_APP_ID }}
          private-key: ${{ secrets.GDX_APP_PRIVATE_KEY }}
          owner: gq-godark
          repositories: gdx-python-sdk-examples
          # contents:write for actions/checkout, the rolling-branch push,
          # and gh pr view/create; pull-requests:write for gh pr create.
          permission-contents: write
          permission-pull-requests: write

      - name: Mint App token (upstream read)
        id: app-token-upstream
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.GDX_APP_ID }}
          private-key: ${{ secrets.GDX_APP_PRIVATE_KEY }}
          owner: gq-godark
          repositories: gdx-python-sdk
          # Only contents:read needed — we just clone and rsync from it.
          permission-contents: read

      - name: Checkout examples (this repo)
        uses: actions/checkout@v5
        with:
          token: ${{ steps.app-token-local.outputs.token }}

      - name: Resolve SDK SHA
        id: sha
        env:
          DISPATCH_SHA: ${{ github.event.client_payload.sdk_sha }}
          INPUT_SHA: ${{ inputs.sdk_sha }}
        run: |
          SHA="${DISPATCH_SHA:-$INPUT_SHA}"
          if [ -z "$SHA" ]; then
            echo "::error::No sdk_sha in dispatch payload and no workflow_dispatch input."
            exit 1
          fi
          echo "full=${SHA}" >> "$GITHUB_OUTPUT"
          echo "short=${SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "Vendoring gdx-python-sdk@${SHA}"

      - name: Checkout upstream gdx-python-sdk at dispatched SHA
        uses: actions/checkout@v5
        with:
          repository: gq-godark/gdx-python-sdk
          ref: ${{ steps.sha.outputs.full }}
          path: upstream
          token: ${{ steps.app-token-upstream.outputs.token }}
          fetch-depth: 1
          # No submodules: refresh_sdk.sh only reads $SRC/src/godark/ and
          # $SRC/shared/symbols.json; the generated _pb2.py bindings are
          # committed in-tree by gdx-python-sdk's auto-regen-protos.yml.

      - name: Refresh vendored artifacts
        env:
          UPSTREAM_SRC: ${{ github.workspace }}/upstream
        run: bash scripts/refresh_sdk.sh "${UPSTREAM_SRC}"

      - name: Detect drift on sdk/
        id: drift
        run: |
          if git diff --quiet -- sdk/; then
            echo "drift=false" >> "$GITHUB_OUTPUT"
            echo "No changes after refresh — already pinned at this SHA. Exiting clean."
          else
            echo "drift=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected on sdk/:"
            git diff --stat -- sdk/
          fi

      - name: Configure bot git identity
        if: steps.drift.outputs.drift == 'true'
        run: |
          git config user.name "gdx-app[bot]"
          git config user.email "gdx-app[bot]@users.noreply.github.com"

      - name: Open or refresh rolling PR
        if: steps.drift.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token-local.outputs.token }}
          BRANCH: auto/bump-sdk-pin
          SDK_SHORT: ${{ steps.sha.outputs.short }}
          SDK_FULL: ${{ steps.sha.outputs.full }}
          SDK_BRANCH: ${{ github.event.client_payload.sdk_branch }}
        run: |
          set -euo pipefail
          git checkout -B "$BRANCH"
          git add sdk/
          git commit -m "chore(sdk): vendor godark python sources from gdx-python-sdk@${SDK_SHORT}

          Auto-generated by .github/workflows/auto-bump-sdk-pin.yml in
          response to a gdx-sdk-changed dispatch. Re-rsyncs
          sdk/godark/** and sdk/shared/symbols.json from
          gdx-python-sdk@${SDK_FULL}.

          Merging this PR to main fires the existing release.yml, which
          rebuilds the wheels-only ZIP, runs the import smoke, and tags
          a new GitHub Release."

          git push --force origin "$BRANCH"

          # Only treat an OPEN PR as "existing". `gh pr view <branch>` also
          # matches a previously merged/closed rolling PR, which suppresses
          # opening a fresh one for the next merge cycle.
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')" ]; then
            echo "Existing open PR force-pushed; no new PR opened."
            gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url'
          else
            gh pr create \
              --base main \
              --head "$BRANCH" \
              --title "auto: bump vendored SDK to ${SDK_SHORT}" \
              --body "Triggered by \`gdx-python-sdk@${SDK_FULL}\` on branch \`${SDK_BRANCH:-main}\`.

          Refreshes \`sdk/godark/**\` and \`sdk/shared/symbols.json\` to vendor the latest SDK.

          - **Source repo:** \`gq-godark/gdx-python-sdk\`
          - **Source SHA:** \`${SDK_FULL}\`
          - **Workflow:** [.github/workflows/auto-bump-sdk-pin.yml](https://github.com/gq-godark/gdx-python-sdk-examples/blob/main/.github/workflows/auto-bump-sdk-pin.yml)

          ### Review checklist
          - [ ] Skim \`sdk/godark/_generated/**\` for any descriptor renames (new wire fields are safe; renames/removals may break hand-written wrappers in upstream \`_proto.py\`/\`client.py\`/\`types.py\`).
          - [ ] Confirm CI build (\`release.yml\`) is green on this PR before merging." \
              --label automation \
              --label sdk-bump
          fi
