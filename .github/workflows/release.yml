name: CI / Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel in-flight runs of the same PR (so updates don't pile up runners), but
# never cancel a push-to-main run — releases are precious.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # --------------------------------------------------------------------------
  # build: wheels-only zip + import smoke.
  #
  # The wheel is built from a fresh checkout of gq-godark/gdx-python-sdk@<ref>
  # where <ref> is read from sdk/UPSTREAM_REF in this repo. The vendored
  # sdk/godark/ tree is verified to match that upstream source by a parity
  # check inside scripts/package.sh — local edits to sdk/godark/ cannot reach
  # the released artifact.
  #
  # Required secret:
  #   GDX_PYTHON_SDK_TOKEN — PAT or fine-grained token with `contents:read`
  #                          on gq-godark/gdx-python-sdk. Used only to clone
  #                          the upstream repo at the pinned ref.
  # --------------------------------------------------------------------------
  build:
    name: Build wheels-only zip
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.ver.outputs.version }}
      bundle_name: ${{ steps.ver.outputs.bundle_name }}
      pinned_ref: ${{ steps.pin.outputs.ref }}
    steps:
      - name: Checkout examples repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install zip
        run: sudo apt-get update -qq && sudo apt-get install -y -qq zip

      - name: Verify GDX_PYTHON_SDK_TOKEN secret is configured
        env:
          UPSTREAM_TOKEN: ${{ secrets.GDX_PYTHON_SDK_TOKEN }}
        run: |
          if [ -z "$UPSTREAM_TOKEN" ]; then
            echo "::error::Missing required secret GDX_PYTHON_SDK_TOKEN."
            echo "::error::Create a PAT (or fine-grained token) with contents:read on gq-godark/gdx-python-sdk and add it under repo Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Read pinned upstream ref
        id: pin
        run: |
          if [ ! -f sdk/UPSTREAM_REF ]; then
            echo "::error::sdk/UPSTREAM_REF missing — run scripts/refresh_sdk.sh and commit it."
            exit 1
          fi
          ref="$(tr -d '[:space:]' < sdk/UPSTREAM_REF)"
          if [ -z "$ref" ]; then
            echo "::error::sdk/UPSTREAM_REF is empty"
            exit 1
          fi
          echo "ref=${ref}" >> "$GITHUB_OUTPUT"
          echo "Pinned upstream ref: ${ref}"

      - name: Checkout pinned upstream gdx-python-sdk
        uses: actions/checkout@v4
        with:
          repository: gq-godark/gdx-python-sdk
          ref: ${{ steps.pin.outputs.ref }}
          path: upstream
          token: ${{ secrets.GDX_PYTHON_SDK_TOKEN }}
          fetch-depth: 1

      - name: Compute version + bundle name
        id: ver
        run: |
          base=$(python3 -c "import tomllib; print(tomllib.load(open('upstream/pyproject.toml','rb'))['project']['version'])")
          version="v${base}-build.${{ github.run_number }}"
          bundle_name="gdx-python-sdk-${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "bundle_name=${bundle_name}" >> "$GITHUB_OUTPUT"
          echo "Building ${bundle_name}.zip (godark==${base} from upstream pin ${{ steps.pin.outputs.ref }})"

      - name: Build wheels-only zip via scripts/package.sh
        env:
          UPSTREAM_SRC: ${{ github.workspace }}/upstream
        run: bash scripts/package.sh ${{ steps.ver.outputs.bundle_name }}

      - name: Recipient install + import smoke (clean venv)
        run: |
          mkdir -p /tmp/recip
          unzip -q ${{ steps.ver.outputs.bundle_name }}.zip -d /tmp/recip
          cd /tmp/recip/${{ steps.ver.outputs.bundle_name }}
          python -m venv .venv
          .venv/bin/pip install --upgrade pip --quiet
          .venv/bin/pip install --quiet wheels/godark-*.whl
          .venv/bin/python -c "from godark import GodarkClient, OrderType, Side, TimeInForce; print('imports OK')"
          .venv/bin/python -m compileall -q examples

      - name: Upload wheels-only zip as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.ver.outputs.bundle_name }}
          path: ${{ steps.ver.outputs.bundle_name }}.zip
          if-no-files-found: error
          retention-days: 14

  # --------------------------------------------------------------------------
  # release: tag + GitHub release attached to the wheels-only zip.
  # Only on push to main, after build passes.
  # --------------------------------------------------------------------------
  release:
    name: Create GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download wheels-only zip from build job
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.bundle_name }}
          path: ./release-asset

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          name: ${{ needs.build.outputs.version }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: ./release-asset/${{ needs.build.outputs.bundle_name }}.zip
          body: |
            **Automated release** built from commit `${{ github.sha }}`.

            Wheel built from upstream `gq-godark/gdx-python-sdk` at pinned ref
            `${{ needs.build.outputs.pinned_ref }}`.

            ## Install

            1. Download `${{ needs.build.outputs.bundle_name }}.zip` from the
               assets below.
            2. Unzip and follow `README.md` inside the bundle:

               ```bash
               unzip ${{ needs.build.outputs.bundle_name }}.zip
               cd ${{ needs.build.outputs.bundle_name }}
               python3 -m venv .venv && source .venv/bin/activate
               pip install --upgrade pip
               pip install wheels/godark-*.whl
               cp .env.example .env   # then fill in your testnet creds
               python examples/quickstart.py
               ```

            See `README.md` and `SDK_REFERENCE.md` inside the bundle for the
            full integration docs.
